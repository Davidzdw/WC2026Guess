<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>世界杯竞猜管理</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar admin-topbar">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>竞猜管理</h1>
      </div>
      <a class="admin-link" href="/">返回竞猜</a>
    </header>

    <main>
      <section id="adminLogin" class="profile-band">
        <div>
          <p class="section-kicker">管理员口令</p>
          <h2>启动服务时终端会打印 Admin key</h2>
        </div>
        <form id="adminKeyForm" class="profile-form">
          <input id="adminKeyInput" placeholder="输入 Admin key" autocomplete="off" />
          <button type="submit">进入</button>
        </form>
      </section>

      <section id="adminPanel" class="view hidden">
        <div class="admin-grid">
          <form id="settingsForm" class="admin-section">
            <p class="section-kicker">基础设置</p>
            <label>
              应用标题
              <input id="appTitleInput" maxlength="40" />
            </label>
            <label>
              每场投注金额（元）
              <input id="stakeInput" type="number" min="1" step="0.01" />
            </label>
            <label>
              开赛前锁定分钟数
              <input id="lockInput" type="number" min="1" step="1" />
            </label>
            <label class="checkbox-label">
              <input id="autoSyncInput" type="checkbox" />
              自动同步赛程和赛果
            </label>
            <label>
              自动同步间隔（分钟）
              <input id="autoSyncMinutesInput" type="number" min="5" step="1" />
            </label>
            <label>
              淘汰赛赛前更新窗口（小时）
              <input id="lookaheadInput" type="number" min="1" step="1" />
            </label>
            <button type="submit">保存设置</button>
          </form>

          <div class="admin-section">
            <p class="section-kicker">赛程和结算</p>
            <div class="button-row">
              <button id="syncButton" type="button">同步网易接口</button>
              <button id="settleButton" class="ghost-button" type="button">结算已完赛</button>
            </div>
            <p id="syncStatus" class="muted"></p>
          </div>
        </div>

        <div class="admin-section wide">
          <p class="section-kicker">运营概览</p>
          <div id="adminOverview" class="overview-grid"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="/admin.js"></script>
  </body>
</html>
